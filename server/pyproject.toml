[project]
name = "nba-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Taylor Tyler", email = "287087051+taylortyler-1@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "mcp>=2.3.0",
    "nba-api>=1.12.0",
]

[project.scripts]
nba-mcp = "nba_mcp:main"
nba-mcp-ingest = "nba_mcp.ingest:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp[cli]>=2.3.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
